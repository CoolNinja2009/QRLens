name: Build APK

on:
  push:
    # Only build when something that affects the APK changes.
    # README, preview.gif, .gitignore etc. don't trigger a build.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:   # "Run workflow" button for manual builds

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for release notes and the version check

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -nE 's/^val appVersion = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error file=app/build.gradle.kts::Couldn't find a line like: val appVersion = \"1.2.3\""
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::v$VERSION is already released. The APK is built for testing (see Artifacts) but no release is published. Bump appVersion in app/build.gradle.kts to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building QR Lens v$VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/qrlens.keystore
            echo "Signing with your QR Lens key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will use a debug key and won't install over your current QR Lens"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk QR-Lens.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Lens-v${{ steps.version.outputs.version }}
          path: QR-Lens.apk

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QR Lens ${{ steps.version.outputs.tag }}
          files: QR-Lens.apk
          make_latest: true
          generate_release_notes: true
          body: |
            **Download:** `QR-Lens.apk` below (Android 11+). Installs as an update over any earlier QR Lens.

            Play Protect may block the install of sideloaded accessibility apps: pause *Scan apps with Play Protect* in the Play Store while installing, then turn it back on. See the [README](https://github.com/${{ github.repository }}#install) for setup.
