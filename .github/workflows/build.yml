name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/qrlens.keystore
            echo "Signing with your QR Lens key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will use a debug key and won't install over your current QR Lens"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk QR-Lens.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Lens-apk
          path: QR-Lens.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QR Lens build ${{ github.run_number }}
          files: QR-Lens.apk
          make_latest: true
